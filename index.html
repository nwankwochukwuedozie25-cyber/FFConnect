<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b7a5a">
  <title>FFConnect — Home</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">FFConnect</div>
    <div class="header-actions">
      <input id="searchInput" class="search" placeholder="Search users or posts..." aria-label="Search" />
      <button id="searchBtn" class="icon-btn" title="Search">🔎</button>
      <button id="notifBtn" class="icon-btn" title="Notifications">🔔<span id="notifBadge" class="badge" style="display:none">0</span></button>
      <div id="profileMenu" class="profile-menu"></div>
    </div>
  </header>

  <main class="app-main">
    <nav class="left-panel">
      <div class="card">
        <h3>Welcome</h3>
        <p>Share updates, follow people, and stay connected.</p>
        <div class="action-list">
          <button class="btn" id="newPostBtn">Create Post</button>
          <button class="btn secondary" id="myProfileBtn">My Profile</button>
          <a class="whatsapp-link" href="https://whatsapp.com/channel/0029VbDUfzA6mYPDOtY9kX3o" target="_blank" rel="noopener">Join our WhatsApp Channel</a>
        </div>
      </div>

      <div class="card hidden-sm">
        <h4>Following</h4>
        <ul id="followingList" class="small-list"></ul>
      </div>

      <div class="card hidden-sm">
        <h4>Suggestions</h4>
        <ul id="suggestionsList" class="small-list"></ul>
      </div>
    </nav>

    <section class="feed" id="feedView">
      <div class="card" id="createPostCard">
        <textarea id="postText" placeholder="What's happening?"></textarea>
        <div class="row">
          <button class="btn" id="postCreateBtn">Post</button>
        </div>
      </div>

      <div id="feedList"></div>
    </section>

    <aside class="right-panel">
      <div class="card">
        <h4>Account</h4>
        <div id="accountArea"></div>
      </div>

      <div class="card">
        <h4>Search results</h4>
        <div id="searchResults"></div>
      </div>
    </aside>
  </main>

  <!-- Notifications drawer -->
  <div id="notificationsDrawer" class="drawer" aria-hidden="true">
    <div class="drawer-header">Notifications <button class="close-btn" onclick="closeNotifications()">✖</button></div>
    <div id="notificationsList" class="drawer-body"></div>
  </div>

  <!-- Profile drawer -->
  <div id="profileDrawer" class="drawer" aria-hidden="true">
    <div class="drawer-header">Profile <button class="close-btn" onclick="closeProfile()">✖</button></div>
    <div id="profileContent" class="drawer-body"></div>
  </div>

  <!-- Auth modal -->
  <div id="authModal" class="modal" aria-hidden="true">
    <div class="modal-content">
      <h3 id="authTitle">Create an account</h3>
      <input id="authUsername" placeholder="Username" />
      <input id="authPassword" placeholder="Password" type="password" />
      <input id="authBio" placeholder="Bio (optional)" />
      <input id="authReferral" placeholder="Referral code (optional)" />
      <div class="row">
        <button class="btn" id="authSubmit">Create account</button>
        <button class="btn secondary" id="authToggle">Switch to Log in</button>
      </div>
      <div id="authMsg" class="small error"></div>
    </div>
  </div>

  <footer class="app-footer">© 2026 FFConnect</footer>

  <script src="app.js"></script>
</body>
</html>
