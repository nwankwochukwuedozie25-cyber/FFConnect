<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1877f2">
  <title>FFConnect</title>

  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background: linear-gradient(180deg, #f6f8fb 0%, #eef2f7 100%);
      color: #0f1724;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    header {
      background: linear-gradient(90deg,#1a73e8,#1877f2);
      color: white;
      padding: 16px;
      text-align: center;
      font-size: 20px;
      font-weight: 700;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .container {
      max-width: 760px;
      margin: 12px auto;
      padding: 12px;
    }

    .card {
      background: white;
      padding: 14px;
      margin-bottom: 14px;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(16,24,40,0.06);
    }

    h2, h3 { margin: 6px 0 12px; }

    textarea {
      width: 100%;
      min-height: 88px;
      padding: 12px;
      border: 1px solid #e6eefc;
      border-radius: 10px;
      resize: vertical;
      font-size: 15px;
      background: #fbfdff;
    }

    .btn {
      background: #1877f2;
      color: white;
      border: none;
      padding: 12px 16px;
      border-radius: 10px;
      margin-top: 10px;
      cursor: pointer;
      font-size: 15px;
      display: inline-flex;
      gap: 8px;
      align-items: center;
    }

    .btn.secondary { background: #eef2ff; color: #0f1724; }

    .post { border-top: 1px solid #f1f5f9; padding-top: 14px; margin-top: 12px; }
    .name { font-weight: 700; font-size: 15px; }

    .actions { margin-top: 8px; display:flex; gap:8px; flex-wrap:wrap; }
    .like { background: #f3f4f6; color: #111; padding:8px 10px; border-radius:8px; border:none; cursor:pointer; }

    footer { text-align: center; padding: 18px; color: #64748b; font-size: 13px; }

    /* WhatsApp channel button — prominent on mobile */
    .whatsapp-cta {
      position: fixed;
      right: 16px;
      bottom: 84px;
      z-index: 30;
      display:flex;
      gap:8px;
      align-items:center;
    }

    .whatsapp-cta a {
      display:inline-block;
      background: #25D366;
      color: white;
      padding: 12px 16px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 700;
      box-shadow: 0 10px 30px rgba(37,211,102,0.18);
    }

    /* Account bar */
    .account-bar { display:flex; justify-content:space-between; align-items:center; gap:12px; }
    .small { font-size: 13px; color:#64748b; }

    /* Responsive */
    @media (max-width: 600px) {
      header { font-size: 18px; padding: 14px; }
      .container { margin: 8px; padding: 8px; }
      .whatsapp-cta { right: 12px; bottom: 78px; }
      .btn { padding: 12px 14px; width: 100%; justify-content:center; }
    }

  </style>
</head>
<body>
  <header>
    🌐 FFConnect
  </header>

  <div class="container">

    <div class="card" id="welcomeCard">
      <div class="account-bar">
        <div>
          <h2 style="margin:0">Welcome to FFConnect</h2>
          <div class="small">Connect, share and communicate with friends — mobile friendly.</div>
        </div>

        <div id="authArea">
          <!-- Will be replaced by JS -->
        </div>
      </div>
    </div>

    <div class="card" id="authCard" style="display:none;">
      <h3 id="authTitle">Create an account</h3>

      <div id="authForm">
        <input type="text" id="username" placeholder="Username" style="width:100%;padding:10px;border-radius:8px;border:1px solid #e6eefc;margin-bottom:8px;">
        <input type="password" id="password" placeholder="Password" style="width:100%;padding:10px;border-radius:8px;border:1px solid #e6eefc;margin-bottom:8px;">
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn" id="submitAuth" onclick="submitAuth()">Create account</button>
          <button class="btn secondary" onclick="toggleAuthMode()" id="toggleAuth">Already have an account?</button>
        </div>
        <div id="authMsg" class="small" style="margin-top:8px;color:#b91c1c"></div>
      </div>
    </div>

    <div class="card" id="postCard" style="display:none;">
      <h3>Create a post</h3>
      <textarea id="postText" placeholder="What's on your mind?" aria-label="Post text"></textarea>
      <button class="btn" id="postBtn" onclick="createPost()">Post</button>
    </div>

    <div class="card">
      <h3>Posts</h3>
      <div id="posts"></div>
    </div>

  </div>

  <div class="whatsapp-cta" aria-hidden="false">
    <a id="whatsappLink" href="https://whatsapp.com/channel/0029VbDUfzA6mYPDOtY9kX3o" target="_blank" rel="noopener noreferrer">Join our WhatsApp Channel</a>
  </div>

  <footer>
    © 2026 FFConnect
  </footer>

  <script>
    // Local storage keys
    const USERS_KEY = 'ff_users_v1';
    const CURRENT_KEY = 'ff_currentUser_v1';
    const POSTS_KEY = 'ff_posts_v1';

    // Simple helpers
    function $(id){return document.getElementById(id)}

    function loadUsers(){
      try { return JSON.parse(localStorage.getItem(USERS_KEY) || '[]'); } catch(e) { return []; }
    }
    function saveUsers(users){ localStorage.setItem(USERS_KEY, JSON.stringify(users)); }

    function currentUser(){
      return JSON.parse(localStorage.getItem(CURRENT_KEY) || 'null');
    }
    function setCurrentUser(user){ localStorage.setItem(CURRENT_KEY, JSON.stringify(user)); renderAuthArea(); }
    function clearCurrentUser(){ localStorage.removeItem(CURRENT_KEY); renderAuthArea(); }

    function loadPosts(){
      try { return JSON.parse(localStorage.getItem(POSTS_KEY) || '[]'); } catch(e) { return []; }
    }
    function savePosts(posts){ localStorage.setItem(POSTS_KEY, JSON.stringify(posts)); }

    // Auth UI
    let authMode = 'register'; // or 'login'
    function toggleAuthMode(){
      authMode = (authMode === 'register') ? 'login' : 'register';
      $('authTitle').textContent = (authMode==='register')? 'Create an account' : 'Log in';
      $('submitAuth').textContent = (authMode==='register')? 'Create account' : 'Log in';
      $('toggleAuth').textContent = (authMode==='register')? 'Already have an account?' : 'Need a new account?';
      $('authMsg').textContent = '';
    }

    function submitAuth(){
      const u = $('username').value.trim();
      const p = $('password').value;
      const msg = $('authMsg');
      msg.style.color = '#b91c1c';
      msg.textContent = '';

      if(!u || !p){ msg.textContent = 'Please provide both username and password.'; return; }
      const users = loadUsers();

      if(authMode === 'register'){
        if(users.find(x => x.username.toLowerCase() === u.toLowerCase())){ msg.textContent = 'Username already taken. Choose another.'; return; }
        const user = { username: u, password: p, createdAt: Date.now() };
        users.push(user);
        saveUsers(users);
        setCurrentUser({ username: u });
        msg.style.color = '#16a34a';
        msg.textContent = 'Account created. You are now logged in.';
        $('username').value = '';
        $('password').value = '';
        showPostCard(true);
        renderPosts();
      } else {
        const found = users.find(x => x.username.toLowerCase() === u.toLowerCase() && x.password === p);
        if(!found){ msg.textContent = 'Invalid username or password.'; return; }
        setCurrentUser({ username: found.username });
        msg.style.color = '#16a34a';
        msg.textContent = 'Logged in.';
        $('username').value = '';
        $('password').value = '';
        showPostCard(true);
        renderPosts();
      }
    }

    function renderAuthArea(){
      const area = $('authArea');
      const user = currentUser();
      if(user){
        area.innerHTML = `<div style="text-align:right"><div style=\"font-weight:700\">${escapeHtml(user.username)}</div><button class=\"btn secondary\" onclick=\"logout()\">Log out</button></div>`;
        $('authCard').style.display = 'none';
        showPostCard(true);
      } else {
        area.innerHTML = `<button class=\"btn\" onclick=\"openAuth()\">Create account / Log in</button>`;
        $('authCard').style.display = 'none';
        showPostCard(false);
      }
    }

    function openAuth(){
      $('authCard').style.display = 'block';
      $('authMsg').textContent = '';
      window.scrollTo({top:0,behavior:'smooth'});
    }

    function logout(){ clearCurrentUser(); renderAuthArea(); }

    // Posts
    function createPost(){
      const text = $('postText').value.trim();
      if(text === ''){ alert('Please write something first.'); return; }
      const user = currentUser();
      if(!user){ alert('You must be logged in to post.'); openAuth(); return; }

      const posts = loadPosts();
      const newPost = { id: Date.now(), author: user.username, text, likes: 0, createdAt: Date.now() };
      posts.unshift(newPost);
      savePosts(posts);
      $('postText').value = '';
      renderPosts();
    }

    function renderPosts(){
      const container = $('posts');
      const posts = loadPosts();
      if(posts.length === 0){ container.innerHTML = '<div class="small">No posts yet. Start the conversation!</div>'; return; }
      container.innerHTML = '';
      for(const p of posts){
        const el = document.createElement('div');
        el.className = 'post';
        el.innerHTML = `\n          <div class=\"name\">${escapeHtml(p.author)}</div>\n          <div style=\"margin-top:6px;white-space:pre-wrap\">${escapeHtml(p.text)}</div>\n          <div class=\"actions\">\n            <button class=\"like\" data-id=\"${p.id}\" onclick=\"likePost(this)\">👍 Like <span style=\"margin-left:6px\">${p.likes}</span></button>\n            <button class=\"btn secondary\" onclick=\"alert('Comments coming soon!')\">💬 Comment</button>\n          </div>\n        `;
        container.appendChild(el);
      }
    }

    function likePost(button){
      const id = Number(button.dataset.id);
      const posts = loadPosts();
      const found = posts.find(p => p.id === id);
      if(!found) return;
      found.likes = (found.likes || 0) + 1;
      savePosts(posts);
      renderPosts();
    }

    function showPostCard(show){
      $('postCard').style.display = show ? 'block' : 'none';
    }

    // Escape helper to avoid XSS on stored posts
    function escapeHtml(s){
      return String(s)
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/\"/g,'&quot;')
        .replace(/\'/g,'&#39;');
    }

    // Initialize
    function bootstrap(){
      // Ensure there's at least one welcome post saved so editing works fine
      if(!localStorage.getItem(POSTS_KEY)){
        savePosts([{ id: 1, author: 'FFConnect User', text: 'Welcome to FFConnect! 🎉', likes: 0, createdAt: Date.now() }]);
      }
      renderAuthArea();
      renderPosts();

      // On larger screens, show post card even if not logged in (encourages sign-in)
      if(window.innerWidth > 700 && currentUser()) showPostCard(true);
    }

    // Keyboard-friendly: submit on Enter when in auth fields (but not in password 'Enter' to avoid accidental submit)
    document.addEventListener('keydown', (e)=>{
      if(e.key === 'Enter' && (document.activeElement.id === 'username' || document.activeElement.id === 'password')){
        e.preventDefault();
        submitAuth();
      }
    });

    // Start
    bootstrap();

  </script>
</body>
</html>
